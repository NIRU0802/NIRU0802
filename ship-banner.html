<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>

body {
  margin: 0;
  overflow: hidden;
  background: linear-gradient(to bottom, #87CEEB, #1e3c72);
  height: 300px;
}

/* WAVES */
.wave {
  position: absolute;
  bottom: 0;
  width: 200%;
  height: 120px;
  background: rgba(255,255,255,0.35);
  border-radius: 40%;
  animation: waveMove 10s linear infinite;
}

.wave:nth-child(2){
  bottom: 15px;
  opacity: .5;
  animation-duration: 14s;
}

.wave:nth-child(3){
  bottom: 30px;
  opacity: .3;
  animation-duration: 18s;
}

@keyframes waveMove {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* SHIP */
.ship {
  position: absolute;
  bottom: 80px;
  left: 20%;
  width: 220px;
  animation: floatShip 4s ease-in-out infinite;
}

@keyframes floatShip {
  0%   { transform: translateY(0px) rotate(0deg); }
  50%  { transform: translateY(-12px) rotate(1deg); }
  100% { transform: translateY(0px) rotate(0deg); }
}

</style>
</head>

<body>

<img class="ship" src="ship.png" />

<div class="wave"></div>
<div class="wave"></div>
<div class="wave"></div>

</body>
</html>
