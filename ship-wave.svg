<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg">

  <!-- Background (GitHub dark theme match) -->
  <rect width="100%" height="100%" fill="#0d1117"/>

  <!-- BACK WAVE -->
  <path fill="#1f6feb" opacity="0.6">
    <animate attributeName="d"
      dur="7s"
      repeatCount="indefinite"
      values="
      M0,180 C150,220 300,140 450,180 C600,220 750,140 900,180 L900,260 L0,260 Z;
      M0,190 C150,150 300,230 450,190 C600,150 750,230 900,190 L900,260 L0,260 Z;
      M0,180 C150,220 300,140 450,180 C600,220 750,140 900,180 L900,260 L0,260 Z
      " />
  </path>

  <!-- FRONT WAVE -->
  <path fill="#58a6ff" opacity="0.85">
    <animate attributeName="d"
      dur="4s"
      repeatCount="indefinite"
      values="
      M0,200 C200,160 350,230 550,200 C700,160 850,230 900,200 L900,260 L0,260 Z;
      M0,190 C200,240 350,170 550,190 C700,240 850,170 900,190 L900,260 L0,260 Z;
      M0,200 C200,160 350,230 550,200 C700,160 850,230 900,200 L900,260 L0,260 Z
      " />
  </path>

  <!-- SHIP FLOATING -->
  <image href="https://raw.githubusercontent.com/NIRU0802/NIRU0802/main/ship.png" x="340" y="85" width="220">
    <animateTransform
      attributeName="transform"
      type="translate"
      dur="3s"
      repeatCount="indefinite"
      values="0 0; 0 -12; 0 0"/>
  </image>

</svg>
